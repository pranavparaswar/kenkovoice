<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Kenko Life — Talk to our Voice Assistant</title>

  <!-- Sarvam voice widget loader -->
  <script src="https://unpkg.com/sarvam-convai-embed"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      min-height: 100vh;
    }
    /* Center label sits above where we pin the widget */
    #call-label {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -100px);
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
      z-index: 2147483647;
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="call-label">Kenko Voice Agent<br>Click to call</div>

  <!-- Paste your EMBED-SCOPED key into api-key below. Never a server-side key. -->
  <sarvam-widget
    api-key="sk_samvaad_8yz9zfqt_m6s1owzuEF00elRP895uEXxD"
    app-id="Conversatio-96f8c7c6-f392"
    org-id="019fa36e-ea53-7cf9-b060-cd079d4562a7"
    workspace-id="019fa36e-ea56-7099-8152-aff3318116da"
    user-id="your_user_id"
    button-text="Begin call"
    interaction-type="call"
    background-color="#ffffff"
    foreground-color="#1a1a1a"
    accent-color="#000000"
  ></sarvam-widget>

  <script>
    // The widget pins itself bottom-right via its own JS after mounting.
    // Re-pin its floating container to the center. We watch the DOM because
    // the element (often in a wrapper div) appears asynchronously.
    function centerWidget() {
      const el = document.querySelector('sarvam-widget');
      if (!el) return;
      // Force the custom element itself to center
      el.style.setProperty('position', 'fixed', 'important');
      el.style.setProperty('left', '50%', 'important');
      el.style.setProperty('top', '50%', 'important');
      el.style.setProperty('right', 'auto', 'important');
      el.style.setProperty('bottom', 'auto', 'important');
      el.style.setProperty('transform', 'translate(-50%, -50%)', 'important');

      // Some builds inject a sibling wrapper (e.g. a fixed div) that actually
      // holds the button. Re-pin any top-level fixed div the script created.
      document.querySelectorAll('body > div').forEach(function (d) {
        if (d.id === 'call-label') return;
        const cs = getComputedStyle(d);
        if (cs.position === 'fixed') {
          d.style.setProperty('left', '50%', 'important');
          d.style.setProperty('top', '50%', 'important');
          d.style.setProperty('right', 'auto', 'important');
          d.style.setProperty('bottom', 'auto', 'important');
          d.style.setProperty('transform', 'translate(-50%, -50%)', 'important');
        }
      });
    }

    // Run repeatedly as the widget mounts, then keep watching for changes.
    const iv = setInterval(centerWidget, 200);
    setTimeout(() => clearInterval(iv), 6000);
    new MutationObserver(centerWidget).observe(document.body, { childList: true, subtree: true });
    window.addEventListener('load', centerWidget);
  </script>
</body>
</html>
