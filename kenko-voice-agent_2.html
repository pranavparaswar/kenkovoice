<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Kenko Life — Talk to our Voice Assistant</title>

  <!-- Sarvam voice widget loader -->
  <script src="https://unpkg.com/sarvam-convai-embed"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1a1a1a;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .hero { max-width: 620px; text-align: center; }
    .logo { width: 96px; height: 96px; margin: 0 auto 28px; display: block; }
    .eyebrow {
      font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
      color: #1c7a4a; font-weight: 600; margin-bottom: 14px;
    }
    h1 { font-size: 44px; line-height: 1.05; letter-spacing: -0.03em; margin-bottom: 18px; }
    p.sub {
      font-size: 18px; line-height: 1.55; color: #5c5c5c;
      max-width: 480px; margin: 0 auto 32px;
    }
    .hint {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 14px; color: #1c7a4a; background: #eaf5ee;
      border-radius: 999px; padding: 10px 18px;
    }
    .hint svg { flex-shrink: 0; }
    .foot { margin-top: 48px; font-size: 13px; color: #a0a0a0; }

    /* Our own clean call button */
    .call-btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: #1c7a4a; color: #fff; border: none;
      font-size: 17px; font-weight: 600; cursor: pointer;
      padding: 16px 34px; border-radius: 999px;
      transition: background 0.15s ease, transform 0.05s ease;
      box-shadow: 0 6px 20px rgba(28,122,74,0.25);
    }
    .call-btn:hover { background: #166139; }
    .call-btn:active { transform: scale(0.98); }
    .call-btn svg { width: 20px; height: 20px; }

    /* Hide the Sarvam widget's own floating card visually, but keep it
       in the DOM and functional so we can trigger it from our button.
       We move it far off-screen rather than display:none, because a
       display:none custom element may not initialise its call session. */
    sarvam-widget {
      position: fixed !important;
      left: -9999px !important;
      top: -9999px !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <main class="hero">
    <img class="logo" src="kenko-logo.png" alt="The Kenko Life" />
    <div class="eyebrow">The Kenko Life</div>
    <h1>Talk to Kenko</h1>
    <p class="sub">
      Questions about meal plans, pricing, or delivery? Start a quick voice
      call with our assistant — no forms, no waiting.
    </p>

    <button class="call-btn" id="callBtn" onclick="startCall()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
      Begin call
    </button>

    <div class="foot">Precision nutrition, delivered daily · Bengaluru</div>
  </main>

  <!-- ============================================================
       SARVAM VOICE WIDGET  (floating button, bottom-right)

       api-key: paste your key between the quotes below.
         !! All your dashboard keys are sk_samvaad_ (secret) keys.
         !! This value is visible in page source. Before deploying
            publicly, confirm in the dashboard whether an embed/
            publishable-scoped key exists. If not, keep this page
            internal or use a server-side proxy.

       logo-url: point at the hosted URL of kenko-logo.png once this
         page is deployed, e.g. https://your-domain.com/kenko-logo.png
       ============================================================ -->
  <sarvam-widget
    api-key="sk_samvaad_8yz9zfqt_m6s1owzuEF00elRP895uEXxD"
    app-id="Conversatio-96f8c7c6-f392"
    org-id="019fa36e-ea53-7cf9-b060-cd079d4562a7"
    workspace-id="019fa36e-ea56-7099-8152-aff3318116da"
    user-id="your_user_id"
    button-text="Begin call"
    interaction-type="call"
    logo-url="kenko-logo.png"
    background-color="#ffffff"
    foreground-color="#ebebeb50"
    accent-color="#1c7a4a"
  ></sarvam-widget>

  <script>
    // Attempt to start the Sarvam call from our own button.
    // The widget's internals live in shadow DOM, so we try, in order:
    //   1) a public method on the element (if one exists)
    //   2) a click forwarded to the launcher button inside its shadow root
    function startCall() {
      const widget = document.querySelector('sarvam-widget');
      if (!widget) { console.warn('sarvam-widget not found'); return; }

      // 1) Try common method names if the widget exposes any.
      for (const m of ['startCall', 'start', 'open', 'beginCall', 'call']) {
        if (typeof widget[m] === 'function') {
          console.log('Starting call via widget.' + m + '()');
          widget[m]();
          return;
        }
      }

      // 2) Fallback: click the launcher button inside the widget's shadow DOM.
      const root = widget.shadowRoot;
      if (root) {
        const btn = root.querySelector('button, [role="button"]');
        if (btn) { console.log('Starting call via shadow-DOM button click'); btn.click(); return; }
      }

      // 3) Last resort: click the host element itself.
      console.log('Falling back to host click');
      widget.click();
    }
  </script>
</body>
</html>
